<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<script>

    let count =0;
    function increment(){
        
        let a = document.getElementById('x');
        a.innerHTML = count++;
    }


     function decrement(){
        
        let a = document.getElementById('x');
        a.innerHTML = count--;
    }
</script>
<body>



    <button onClick = increment()> click me to increase</button>
    <button onClick = decrement()> click me to decrease</button>
    <p id = 'x' > 0</p>
    
</body>
</html>
